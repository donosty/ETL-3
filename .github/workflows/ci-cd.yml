name: ETL 3 Pipeline CI/CD

on:
  push:
    branches: [ Main ]
  pull_request:
    branches: [ Main ]

jobs:

  lint-and-test:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Linter
        run: uv run ruff check . --select=E9,F63,F7,F82

      - name: Run Unit Tests
        run: PYTHONPATH=. uv run pytest tests/ -v

      - name: Syntax Check
        run: uv run python -m py_compile src/main.py

  build-and-push:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ETL Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/etl-3:latest
            ${{ secrets.DOCKER_USERNAME }}/etl-3:${{ github.sha }}