services:
  db:
    image: postgres:15-alpine
    container_name: bd-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $DB_USER -d $DB_NAME"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - data_network
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d

  app-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: etl_app_dev
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-admin}:${DB_PASSWORD:-secret}@db:5432/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy    
    env_file:
      - .env
    networks:
      - data_network


  app-prod:
    profiles: ["prod"]
    image: donosty/etl-3:latest
    container_name: etl_app_prod
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-admin}:${DB_PASSWORD:-secret}@db:5432/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy    
    env_file:
      - .env
    networks:
      - data_network

networks:
  data_network:
    driver: bridge

volumes:
  postgres_data: